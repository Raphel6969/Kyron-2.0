services:
  # 1. FastAPI Backend API
  - type: web
    name: hackengine-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ENABLE_EXTERNAL_API
        value: "true"
      - key: JWT_SECRET
        generateValue: true

  # 2. React Vite Web Frontend
  - type: web
    name: hackengine-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hackengine-api
          property: url
