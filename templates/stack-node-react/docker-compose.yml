version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: node-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: node_db
    ports:
      - "5432:5432"

  server:
    build: ./server
    container_name: node-server
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/node_db
      - PORT=8000
    depends_on:
      - db
