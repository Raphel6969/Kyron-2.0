[workspace]
resolver = "2"
members = [
    "types",
    "scanner",
    "pinning",
    "policy",
    "openappa-adapter",
    "attest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kyron Security Team"]
license = "MIT"
repository = "https://github.com/kyron-security/kyron"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
