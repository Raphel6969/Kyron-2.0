# Render Blueprint Specification for Kyron 2.0 Web Service
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kyron-web
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kyron-db
          property: connectionString
      - key: DB_BRANCH
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: kyron-db
    plan: free
    databaseName: kyron_db
    user: kyron
