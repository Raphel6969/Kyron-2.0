# Render Infrastructure as Code Blueprint for Kyron 2.0 Production Stack
services:
  # 1. PostgreSQL Database
  - type: postgres
    name: kyron-production-db
    plan: starter
    region: oregon
    ipAllowList: [] # internal access only
    databaseName: kyron_db
    user: kyron

  # 2. Control Plane API
  - type: web
    name: kyron-control-api
    runtime: docker
    dockerfilePath: control/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kyron-production-db
          property: connectionString
      - key: CONTROL_API_PORT
        value: 8001
      - key: LOG_LEVEL
        value: INFO

  # 3. Protocol Gateway
  - type: web
    name: kyron-gateway
    runtime: docker
    dockerfilePath: gateway/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: GATEWAY_PORT
        value: 8080
      - key: GATEWAY_MODE
        value: enforce
      - key: CONTROL_PLANE_URL
        fromService:
          type: web
          name: kyron-control-api
          property: host

  # 4. Modern SOC Web Console
  - type: web
    name: kyron-soc-ui
    runtime: docker
    dockerfilePath: ui/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /healthz
