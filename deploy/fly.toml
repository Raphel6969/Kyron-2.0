# fly.toml — Kyron 2.0 Cloud Deployment on Fly.io
app = "kyron-gateway-prod"
primary_region = "iad"

[build]
  dockerfile = "gateway/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services.http_checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "5s"
  method = "get"
  path = "/healthz"
  protocol = "http"

[env]
  GATEWAY_PORT = "8080"
  GATEWAY_MODE = "enforce"
  LOG_LEVEL = "info"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
