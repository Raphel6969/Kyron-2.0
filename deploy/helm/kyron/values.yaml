# Kyron 2.0 Default Helm Values

global:
  environment: production
  imagePullSecrets: []

gateway:
  replicaCount: 3
  image:
    repository: ghcr.io/kyron-security/gateway
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    GATEWAY_MODE: enforce
    LOG_LEVEL: info

controlApi:
  replicaCount: 2
  image:
    repository: ghcr.io/kyron-security/control-api
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 8001
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  database:
    host: kyron-postgres
    port: 5432
    name: kyron_db
    user: kyron

ui:
  replicaCount: 2
  image:
    repository: ghcr.io/kyron-security/ui
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: console.kyron.internal
      paths:
        - path: /
          pathType: Prefix
          service: ui
        - path: /v1
          pathType: Prefix
          service: control-api
        - path: /sse
          pathType: Prefix
          service: gateway
  tls:
    - secretName: kyron-tls-cert
      hosts:
        - console.kyron.internal
