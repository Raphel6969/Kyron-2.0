apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-control-api
  labels:
    app.kubernetes.io/name: kyron-control-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.controlApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kyron-control-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyron-control-api
    spec:
      containers:
        - name: control-api
          image: "{{ .Values.controlApi.image.repository }}:{{ .Values.controlApi.image.tag }}"
          imagePullPolicy: {{ .Values.controlApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.controlApi.resources | nindent 12 }}
          env:
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.controlApi.database.user }}:password@{{ .Values.controlApi.database.host }}:{{ .Values.controlApi.database.port }}/{{ .Values.controlApi.database.name }}"
            - name: CONTROL_API_PORT
              value: "8001"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-control-api
  labels:
    app.kubernetes.io/name: kyron-control-api
spec:
  type: {{ .Values.controlApi.service.type }}
  ports:
    - port: {{ .Values.controlApi.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: kyron-control-api
